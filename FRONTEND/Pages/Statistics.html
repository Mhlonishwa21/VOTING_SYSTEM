<!DOCTYPE html>
<html>
    <head>
        <style>
             #Statistics {
            display: flex;
            flex-direction: column;      /* Keeps the heading on top */
            align-items: center;
            min-height: 10vh;
            padding: 80px 20px 40px;
            box-sizing: border-box;
            text-align: center;
            background-color: #232d63;   
            border: 4px solid rgb(12, 12, 39);
            }

            /* Heading stays above */
            #Statistics .stats {
                width: 100%;
                color: antiquewhite;
                font-size: 32px;
                margin-bottom: 35px;
            }

            .cards{
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
                gap: 20px;
                margin-top: 20px;
            }

            /* NEW: Create a wrapper row for the cards inside #Statistics */
            /* (Or add this class to a container div wrapping your 3 cards in HTML) */
            .cards-container {
                display: flex;
                flex-direction: row;         /* Forces children strictly horizontal */
                justify-content: center;
                gap: 20px;
                width: 100%;
                max-width: 1200px;
            }

            /* Statistics cards */
            .registered,
            .males,
            .females,
            .regions {
                flex: 1;                     /* Distributes them evenly */
                min-width: 0;                /* Prevents flex items from overflowing */
                box-sizing: border-box;

                display: flex;
                flex-direction: column;      /* Stack text label above the number */
                align-items: center;
                justify-content: center;

                background-color: #1a1855;   
                border: 1px solid rgb(109, 33, 50);    
                border-radius: 12px;
                padding: 20px 10px;

                color: #111;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
                transition: transform 0.3s;
            }

            /* Hover effect */
            .registered:hover,
            .males:hover,
            .females:hover,
            .regions:hover {
                transform: translateY(-5px);
            }

            /* Card labels */
            .registered h3,
            .males h3,
            .females h3,
            .regions h3 {
                color: #e66363;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                margin: 8px 0 0;
                overflow-wrap: anywhere;
            }

            /* Numbers */
            .results,
            .NoMales,
            .NoFemales,
            .NoRegions{
                color: #f06e6e;
                font-size: 36px;
                font-weight: bold;
                margin: 10px 0 0;
                line-height: 1;
            }

        </style>
    </head>
    <body></body>
</html>
