<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Khetha Online</title>
    <style>

/* =========================================
   KHETHA ONLINE - REGISTER PAGE
   White & Royal Blue Theme
   ========================================= */

:root {
    --primary: #173f91;
    --primary-dark: #102e70;
    --primary-light: #eaf1fc;
    --white: #ffffff;
    --background: #f4f7fb;
    --text-dark: #182b49;
    --text-muted: #58677d;
    --border: #dce5f2;
    --gold: #e8b83d;
}

/* =========================================
   GLOBAL STYLING
   ========================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 50px 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Segoe UI', Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f4f7fb 50%,
            #eaf1fc 100%
        );

    color: var(--text-dark);
}

/* =========================================
   REGISTRATION CONTAINER
   ========================================= */

.register-container {
    width: 100%;
    max-width: 520px;

    padding: 42px 40px;

    background: var(--white);

    border: 1px solid var(--border);
    border-radius: 16px;

    box-shadow:
        0 12px 40px rgba(16, 46, 112, 0.09),
        0 3px 10px rgba(16, 46, 112, 0.03);

    color: var(--text-dark);
}

/* =========================================
   REGISTRATION HEADING
   ========================================= */

.register-container h1 {
    text-align: center;

    color: var(--primary-dark);

    font-size: 34px;
    font-weight: 750;

    margin: 0 0 12px;
}

/* Small gold underline */

.register-container h1::after {
    content: "";
    display: block;

    width: 55px;
    height: 4px;

    background: var(--gold);
    border-radius: 5px;

    margin: 15px auto 0;
}

/* Subtitle */

.subtitle {
    text-align: center;

    color: var(--text-muted);

    font-size: 15px;
    line-height: 1.7;

    margin: 0 0 32px;
}

/* =========================================
   FORM GROUPS
   ========================================= */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: var(--text-dark);

    font-size: 14px;
    font-weight: 600;
}

/* =========================================
   INPUT FIELDS
   ========================================= */

.form-group input,
.form-group select {
    width: 100%;
    height: 48px;

    padding: 12px 14px;

    background: #f9fbff;

    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-dark);

    font-family: inherit;
    font-size: 15px;

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
}

/* Input placeholders */

.form-group input::placeholder {
    color: #9aa8bb;
}

/* Input hover */

.form-group input:hover,
.form-group select:hover {
    border-color: #a8c2eb;
}

/* Input focus */

.form-group input:focus,
.form-group select:focus {
    outline: none;

    background: var(--white);

    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(23, 63, 145, 0.10);
}

/* Dropdown styling */

.form-group select {
    cursor: pointer;
}

/* =========================================
   FIRST AND MIDDLE NAME ROW
   ========================================= */

.name-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

/* =========================================
   REGISTER BUTTON
   ========================================= */

.register-btn {
    width: 100%;

    padding: 15px;
    margin-top: 12px;

    border: none;
    border-radius: 8px;

    background: var(--primary);
    color: var(--white);

    font-family: inherit;
    font-size: 16px;
    font-weight: 650;

    cursor: pointer;

    transition:
        background 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

/* Register button hover */

.register-btn:hover {
    background: var(--primary-dark);

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(23, 63, 145, 0.18);
}

/* Register button active */

.register-btn:active {
    transform: translateY(0);
}

/* Disabled button */

.register-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;

    transform: none;
    box-shadow: none;
}

/* =========================================
   LOGIN LINK
   ========================================= */

.login-link {
    text-align: center;

    margin: 25px 0 0;

    color: var(--text-muted);

    font-size: 14px;
}

/* Login hyperlink */

.login-link a {
    color: var(--primary);

    font-weight: 650;
    text-decoration: none;

    transition: color 0.3s ease;
}

.login-link a:hover {
    color: var(--primary-dark);
    text-decoration: underline;
}

/* =========================================
   FORM MESSAGES
   ========================================= */

#message {
    text-align: center;

    font-size: 14px;
    line-height: 1.6;

    margin-top: 15px;
}

#message:empty {
    display: none;
}

/* =========================================
   MOBILE RESPONSIVENESS
   ========================================= */

@media (max-width: 550px) {

    body {
        padding: 25px 15px;
    }

    .register-container {
        padding: 30px 24px;
        border-radius: 12px;
    }

    .register-container h1 {
        font-size: 28px;
    }

    .subtitle {
        font-size: 14px;
    }

    .name-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .form-group input,
    .form-group select {
        height: 46px;
    }

    .register-btn {
        font-size: 15px;
    }
}

/* =========================================
   ACCESSIBILITY
   ========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}


    </style>
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>
        <p class="subtitle">Register to make your voice heard</p>

        <form id="registerForm">

            <div class="name-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName"
                           placeholder="First name" required>
                </div>

                <div class="form-group">
                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName"
                           placeholder="Optional">
                </div>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName"
                       placeholder="Enter your last name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="idNumber">South African ID Number</label>
                <input
                    type="text"
                    id="idNumber"
                    name="idNumber"
                    placeholder="Enter your 13-digit SA ID number"
                    minlength="13"
                    maxlength="13"
                    pattern="[0-9]{13}"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="municipality">Municipality</label>
                <select id="municipality" name="municipality" required>
                    <option value="">Select Municipality</option>
                    <option value="1">Okhahlamba</option>
                    <option value="2">Alfred Duma</option>
                    <option value="3">Inkosi Langalibalele</option>
                    <option value="4">Msunduzi</option>
                    <option value="5">uMngeni</option>
                    <option value="6">Newcastle</option>
                    <option value="7">KwaDukuza</option>
                    <option value="8">Ray Nkonyeni</option>
                    <option value="9">City of uMhlathuze</option>
                    <option value="10">eThekwini</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Create a password"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password" required>
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <button type="submit" class="register-btn">
                Register
            </button>

            <p class="login-link">
                Already have an account?
                <a href="Login.html">Log In</a>
            </p>

        </form>
    </div>

    <script src="Register.js"></script>

</body>
</html>
