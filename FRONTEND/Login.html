<!DOCTYPE html>
<html>
    <head>

        <style>

/* =========================================
   KHETHA ONLINE - LOGIN PAGE
   White & Royal Blue Theme
   ========================================= */

:root {
    --primary: #173f91;
    --primary-dark: #102e70;
    --primary-light: #eaf1fc;
    --white: #ffffff;
    --background: #f4f7fb;
    --text-dark: #182b49;
    --text-muted: #58677d;
    --border: #dce5f2;
    --gold: #e8b83d;
}

/* GLOBAL STYLING */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: 'Segoe UI', Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #ffffff 0%,
        #f4f7fb 50%,
        #eaf1fc 100%
    );

    color: var(--text-dark);
}

/* LOGIN SECTION */

#Login {
    min-height: 100vh;
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 50px 20px;
}

/* LOGIN CONTAINER */

#details {
    width: 100%;
    max-width: 430px;

    margin: 0 auto;
    padding: 42px 40px;

    background: var(--white);

    border: 1px solid var(--border);
    border-radius: 16px;

    box-shadow:
        0 12px 40px rgba(16, 46, 112, 0.09),
        0 3px 10px rgba(16, 46, 112, 0.03);
}

/* LOGIN HEADING */

#details h1 {
    text-align: center;

    color: var(--primary-dark);

    font-size: 34px;
    font-weight: 750;

    margin: 0 0 12px;
}

/* GOLD UNDERLINE */

#details h1::after {
    content: "";
    display: block;

    width: 55px;
    height: 4px;

    background: var(--gold);
    border-radius: 5px;

    margin: 15px auto 0;
}

/* SUBTITLE */

#details .subtitle {
    text-align: center;

    color: var(--text-muted);

    font-size: 15px;
    line-height: 1.7;

    margin: 0 0 32px;
}

/* FORM LABELS */

#details label {
    display: block;

    color: var(--text-dark);

    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}

/* INPUT FIELDS */

#details input {
    width: 100%;
    height: 48px;

    padding: 12px 14px;
    margin-bottom: 20px;

    background: #f9fbff;
    color: var(--text-dark);

    border: 1px solid var(--border);
    border-radius: 8px;

    font-family: inherit;
    font-size: 15px;

    outline: none;

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
}

/* INPUT PLACEHOLDERS */

#details input::placeholder {
    color: #9aa8bb;
}

/* INPUT HOVER */

#details input:hover {
    border-color: #a8c2eb;
}

/* INPUT FOCUS */

#details input:focus {
    background: var(--white);

    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(23, 63, 145, 0.10);
}

/* LOGIN BUTTON */

#details .login-button {
    width: 100%;

    padding: 15px;
    margin-top: 8px;

    background: var(--primary);
    color: var(--white);

    border: none;
    border-radius: 8px;

    font-family: inherit;
    font-size: 16px;
    font-weight: 650;

    cursor: pointer;

    transition:
        background 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

/* BUTTON HOVER */

#details .login-button:hover {
    background: var(--primary-dark);

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(23, 63, 145, 0.18);
}

/* BUTTON ACTIVE */

#details .login-button:active {
    transform: translateY(0);
}

/* DISABLED BUTTON */

#details .login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;

    transform: none;
    box-shadow: none;
}

/* REGISTER LINK */

#details .register {
    text-align: center;

    color: var(--text-muted);

    font-size: 14px;

    margin: 25px 0 0;
}

/* REGISTER HYPERLINK */

#details .register a {
    color: var(--primary);

    font-weight: 650;
    text-decoration: none;

    transition: color 0.3s ease;
}

#details .register a:hover {
    color: var(--primary-dark);
    text-decoration: underline;
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 550px) {

    #Login {
        padding: 25px 15px;
    }

    #details {
        padding: 32px 24px;
        border-radius: 12px;
    }

    #details h1 {
        font-size: 28px;
    }

    #details .subtitle {
        font-size: 14px;
    }

    #details input {
        height: 46px;
    }

    #details .login-button {
        font-size: 15px;
    }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}

        </style>
    </head>
    <body>
        <section id="Login">
            <div id="details">

                <h1>Welcome Back</h1>

                <p class="subtitle">
                    Sign in to continue to your account
                </p>

                <form>
                    <div>
                        <label for="Username">Username</label>
                        <input
                            type="text"
                            id="Username"
                            name="Username"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button">
                        Log In
                    </button>
                </form>

                <p class="register">
                    Don't have an account?
                    <a href="Register.html">Register</a>
                </p>

            </div>
        </section>
    </body>
</html>
